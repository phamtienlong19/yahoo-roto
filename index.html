 position:sticky;left:0;z-index:2;min-width:clamp(108px,20cqw,340px);max-width:clamp(108px,20cqw,340px);box-shadow:1px 0 0 #e6ebef}

.st td.hist{min-width:0;padding-left:.6em;padding-right:.6em}.hb{display:inline-flex;align-items:flex-end;gap:1px;height:1.9em;vertical-align:middle}.hb i{display:block;width:.4em;min-height:2px;background:#9fb3c4;border-radius:1px 1px 0 0}.hb i.po{background:#58b183}

.st th.sep,.st th.tot{min-width:0}
.st td.pos{color:#1d7a46}.st td.neg{color:#b02a46}
.st td.cat{font-weight:520}

.st td.kw{color:#6a7785;font-weight:600}

.chips span.green-strong{background:var(--green-strong);color:#164629}.chips span.green-soft{background:var(--green-soft);color:#27543b}
.chips span.red-strong{background:var(--red-strong);color:#662d38}.chips span.red-soft{background:var(--red-soft);color:#72404a}
.small{display:block;font-size:.6em;font-weight:600;opacity:.75}
.note{font-size:clamp(11px,1.07cqw,18px);color:#6a7785;text-align:center;margin-top:1.1em;line-height:1.4}
.stamp{font-size:clamp(10px,.9cqw,15px);color:#5f6e7e;text-align:center;margin-top:.8em}

.legend{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:0 auto 1.4em;font-size:clamp(11px,1.07cqw,18px);color:#4c6072}

@supports not (width:1cqw){

}

.chip.light-red{background:var(--light-red)}.chip.red{background:var(--red)}.chip.dark-red{background:var(--dark-red)}

tr.me-row>td{box-shadow:inset 0 2px 0 #1667ac2e,inset 0 -2px 0 #1667ac2e}

 nav{position:relative;flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:0 2px 4px;margin-bottom:12px;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}

<script id="pure">

/* One week's category luck per team and category: [real, expected] = categories won against the actual opponent, and the share of the other teams the stats would have beaten

function catLuckWeek(doc,w){

/* Any range of weeks -> {view, comp}: the same season view and season boards the report ships for 1..N, rebuilt from the per-week views (so a reader can pick the weeks).

    if(c.pct){r=tv.raw&&tv.raw[c.cat];if(r){s+=r[0];d+=r[1];seen=true;}}else if(tv.values[c.cat]!=null){s+=tv.values[c.cat];seen=true;}});
   tot[t][c.cat]=!seen?null:c.pct?(d?s/d:null):s;});});

 ids.forEach(function(a){ids.forEach(function(b){if(a!==b)mx[a][b]=[0,0,0];});});
 W.forEach(function(wv){ids.forEach(function(a){var r=wv.teams[a].allPlay;for(i=0;i<3;i++)rec[a][i]+=r[i];
  ids.forEach(function(b){if(a!==b){var c=wv.matrix[a][b];for(i=0;i<3;i++)mx[a][b][i]+=c[i];}});});});

 var ro=ids.slice().sort(function(a,b){return total[b]-total[a]||a-b;}),
  ap=ids.slice().sort(function(a,b){return (pctOf(rec[b])||0)-(pctOf(rec[a])||0)||total[b]-total[a]||a-b;}),
  view={label:"Season, weeks "+(ws.length>1?ws[0]+"-"+ws[ws.length-1]:ws[0]),weeks:ws.slice(),order:ro,allPlayOrder:ap,teams:teams,matrix:matrix};
 /* the boards */
 var seasonRoto={},wsum={},weeklyRoto={},seasonAllPlay={},realRecord={},catLuck={},kings={},boomBust={},power={},wk={};
 ids.forEach(function(t){wk[t]={};ws.forEach(function(w){wk[t][w]=weekly[t][w];});seasonRoto[t]={total:total[t],rank:rank[t]};wsum[t]=sum(ws.map(function(w){return wk[t][w].total;}));});
 var rk=rankOf(wsum,true);ids.forEach(function(t){weeklyRoto[t]={sum:wsum[t],avg:wsum[t]/ws.length,rank:rk[t],weekRanks:ws.map(function(w){return wk[t][w].rank;})};});
 var apw={};ids.forEach(function(t){apw[t]=pctOf(rec[t]);});rk=rankOf(apw,true);
 ids.forEach(function(t){seasonAllPlay[t]={record:rec[t],winPct:pctOf(rec[t]),rank:rk[t]};});
 var real={},cpct={};
 ids.forEach(function(t){var r=[0,0,0],c=[0,0,0],exp=0;ws.forEach(function(w){var v=wk[t][w];if(v.result==null)return;r["WLT".indexOf(v.result)]++;for(i=0;i<3;i++)c[i]+=v.catRecord[i];exp+=pctOf(v.allPlay)||0;});

 rk=rankOf(cpct,true);

 var cl={};ids.forEach(function(t){cl[t]={};cats.forEach(function(c){cl[t][c.cat]=[0,0];});});

 var lk={};ids.forEach(function(t){lk[t]=sum(cats.map(function(c){return cl[t][c.cat][0]-cl[t][c.cat][1];}));});rk=rankOf(lk,true);
 ids.forEach(function(t){var by={};cats.forEach(function(c){by[c.cat]={real:cl[t][c.cat][0],expected:cl[t][c.cat][1],diff:cl[t][c.cat][0]-cl[t][c.cat][1]};});
  catLuck[t]={real:sum(cats.map(function(c){return cl[t][c.cat][0];})),expected:sum(cats.map(function(c){return cl[t][c.cat][1];})),luck:lk[t],byCat:by,rank:rk[t]};});

  function best(items){var m=null,out;items=items.filter(function(x){return x[2]!=null;});if(!items.length)return null;

  ws.forEach(function(w,wi){ids.forEach(function(t){bw.push([t,w,W[wi].teams[t].values[c.cat]]);});});

/* Strength of schedule: the opponents' real winning percentage. For every finished matchup of a team, take that opponent's actual record over the same weeks WITHOUT its
   games against this team, and add the records up; SOS = (W + T/2) / games of that combined record. basis "matchups" counts weekly matchup results, "cats" the category
