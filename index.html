<script id="pure">
/* Pure helpers (no DOM): colour buckets, places, number formats. Unit-tested by tests/test_page.py. */
var RotoPure=(function(){
"use strict";
function places(vals){ /* higher is better; 1 = worst ... n = best; level values share the average place. null stays null */
 var idx=[],out=[],i,j,k;for(i=0;i<vals.length;i++){out.push(null);if(vals[i]!=null)idx.push(i);}
 idx.sort(function(a,b){return vals[a]-vals[b];});
 for(i=0;i<idx.length;i=j+1){j=i;while(j+1<idx.length&&vals[idx[j+1]]===vals[idx[i]])j++;for(k=i;k<=j;k++)out[idx[k]]=(i+1+j+1)/2;}
 return out;}
function cls(p,n){ /* roto points relative to n teams -> colour class */
 if(p==null)return "mid";
 if(p>=n-2)return "green-strong";if(p>=n-5)return "green-soft";if(p<=3)return "red-strong";if(p<=6)return "red-soft";return "mid";}
function rankCls(r,n){return r==null?"mid":cls(n+1-r,n);}
function matrixCls(m){ /* margin (category wins minus losses; the weekly average on the season matrix) -> cell colour */
 if(m>=5)return "dark-green";if(m>=3)return "green";if(m>0)return "light-green";if(m===0)return "white";if(m>-3)return "light-red";if(m>-5)return "red";return "dark-red";}
function fmtVal(pct,v){if(v==null)return "–";if(pct)return v.toFixed(3).replace(/^0/,"");return String(Math.round(v*100)/100);}
function fmtPts(p){return p==null?"–":(p%1?p.toFixed(1):String(p));}
function pct3(x){return x==null?"–":x.toFixed(3);}
function signed(x,d){if(x==null)return "–";var s=Math.abs(x).toFixed(d);return (x>0?"+":x<0?"−":"")+s;}
function sortKey(t){ /* a table cell's text -> the number to sort by (null = sort as text). "+1.23", "−0.4", ".518", "W2", "W3 · 105.5" (after the dot), "18-8-1" (the first number) */
 t=String(t==null?"":t).trim();var i=t.indexOf("\u00b7");if(i>=0)t=t.slice(i+1).trim();
 t=t.replace(/\u2212/g,"-").replace(/^W(?=\d)/,"");var m=t.match(/^[+-]?(\d+\.?\d*|\.\d+)/);return m?parseFloat(m[0]):null;}
return {places:places,cls:cls,rankCls:rankCls,matrixCls:matrixCls,fmtVal:fmtVal,fmtPts:fmtPts,pct3:pct3,signed:signed,sortKey:sortKey};
})();
</script>
<script>
(function(){
"use strict";

 PM=location.hostname.match(/^([^.]+)\.github\.io$/),PS=location.pathname.split("/")[1],
 REPO=Q.get("repo")||(PM&&PS?PM[1]+"/"+PS:""),                /* on <owner>.github.io/<repo>/ the repo is known: no ?repo= needed */
 SRC=Q.get("data")||"",
 REFRESH=120000,STALE=15*60000,ME=Q.get("me")||"",ME_URL=!!Q.get("me"),DOC=null,

 S={week:Q.get("week")?parseInt(Q.get("week"),10):null,season:Q.get("season")==="1"||!!Q.get("board"),view:Q.get("view")||"roto",board:Q.get("board")||null,explicit:!!(Q.get("week")||Q.get("season")==="1"||Q.get("board"))};   /* ?board=catluck alone opens the Season tab on that board */
if(S.view==="raw")S.view="stats";
if(STATIC)document.body.classList.add("static");

 (kids||[]).forEach(function(c){if(c==null)return;e.appendChild(typeof c==="string"?document.createTextNode(c):c);});return e;}

/* ---- URL state ---- */

function pushUrl(){if(STATIC)return;var q=new URLSearchParams(location.search);["week","season","view","board"].forEach(function(k){q.delete(k);});
 if(S.season){q.set("season","1");q.set("board",boardOf());}else{if(S.explicit||S.week)q.set("week",String(weekNo()));q.set("view",viewOf());}
 try{history.replaceState(null,"","?"+q.toString());}catch(e){}}
function setWeek(w){S.explicit=true;if(w==="season"){S.season=true;S.board=null;}else{S.season=false;S.week=w;}update();}

/* ---- chrome: week strip, status, view tabs ---- */
function drawStrip(){var st=$("strip");st.textContent="";var w=weekNo();
 DOC.weeks.forEach(function(k){var b=h("button",{role:"tab","aria-selected":(!S.season&&k===w)?"true":"false",class:k===cur()?"live":"",title:"Week "+k+(k===cur()?" (in progress)":"")},["W"+k]);b.onclick=function(){setWeek(k);};st.appendChild(b);});
 var sb=h("button",{role:"tab",class:"season","aria-selected":S.season?"true":"false"},["Season"]);sb.onclick=function(){setWeek("season");};st.appendChild(sb);
 var sel=st.querySelector('[aria-selected="true"]');if(sel)st.scrollLeft=sel.offsetLeft-(st.clientWidth-sel.offsetWidth)/2;
 var seq=DOC.weeks.concat(["season"]),i=S.season?seq.length-1:seq.indexOf(w);$("prev").disabled=i<=0;$("next").disabled=i>=seq.length-1;}
function asOf(){var t=new Date(DOC.asOf),age=Date.now()-t.getTime();
 return {text:t.toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}),stale:age>STALE,min:Math.round(age/60000)};}
function drawStatus(){var el=$("status");el.textContent="";var w=weekNo(),a=asOf(),live=S.season||w===cur();
 var lead=S.season?"Season, "+span(DOC.views.season).toLowerCase()+(DOC.weeks.length?" · week "+cur()+" in progress":""):"Week "+w+(live?" (in progress)":"");
 el.appendChild(h("b",{text:lead}));
 el.appendChild(document.createTextNode(live?" · As of "+a.text:" · Final"));
 if(!ME&&!STATIC)el.appendChild(h("span",{class:"hint",text:" · tap your team to highlight it"}));
 if(live&&a.stale&&!STATIC)el.appendChild(h("span",{class:"stale",text:" · ⚠ data is "+a.min+" min old, the feed may have stalled"}));}
function drawNav(){var nav=$("nav");nav.textContent="";nav.className=S.season?"sub":"";
 var items=S.season?BOARDS.filter(function(x){return x[0]!=="catluck"||(DOC.composites&&DOC.composites.catLuck);}):VIEWS,on=S.season?boardOf():viewOf();
 items.forEach(function(it){var b=h("button",{class:it[0]===on?"active":"",text:it[1]});b.onclick=function(){setView(it[0]);};nav.appendChild(b);});
 var a=nav.querySelector(".active");if(a&&nav.scrollWidth>nav.clientWidth)nav.scrollLeft=a.offsetLeft-(nav.clientWidth-a.offsetWidth)/2;}

/* ---- sheets ---- */
function sheet(kind,title,sub,body,note){
 var inner=[h("h1",{text:title}),h("div",{class:"view-subtitle",text:sub})];
 if(note&&!STATIC){var dt=h("details",{class:"how"},[h("summary",{text:"How to read this"}),h("p",{text:note})]);if(S.how)dt.open=true;dt.addEventListener("toggle",function(){S.how=dt.open;});inner.push(dt);}
 inner=inner.concat(body);
 if(note&&STATIC)inner.push(h("div",{class:"note",text:note}));
 if(STATIC){var a=asOf();inner.push(h("div",{class:"stamp",text:(S.season?"Season":"Week "+weekNo())+(S.season||weekNo()===cur()?" (in progress) · as of "+a.text:" · final")}));}

function scroller(t){return h("div",{class:"tscroll"},[t]);}
var TIPS={"Real cats":"Categories won against your actual opponent each week (a level category counts half)","Expected cats":"What your stats earned: in each category, the share of the other teams you would have beaten that week, added up",
 "Luck":"Real minus expected: positive = more wins than your stats earned","Cat W-L-T":"Category record against your actual opponents: how Yahoo ranks category leagues","Cat Win%":"(W + T/2) / (W + L + T) over every category battle",
 "Matchups":"Weekly matchup record (a tied matchup counts half a win)","Real wins":"Matchups actually won (a tie counts half)","Expected wins":"The sum of each week's all-play Win%","All-Play":"Record against every other team, category by category","Win%":"(W + T/2) / (W + L + T)",
 "Rank":"1 = best; level teams share a rank","Consistency (SD)":"Standard deviation of the weekly roto totals: lower = steadier"};
function th(t,c,tip){return h("th",{class:c||null,text:t,title:tip||TIPS[t]||null});}
/* My team: tap a team name to highlight it on every board; remembered on this device (never sent anywhere). ?me=<teamId> in the link wins on first load. */
function meKey(){return "roto.me."+(DOC&&DOC.league||LEAGUE||"");}
function loadMe(){if(ME_URL||STATIC||!DOC)return;try{ME=localStorage.getItem(meKey())||"";}catch(e){}}
function setMe(id){id=String(id);ME=ME===id?"":id;ME_URL=true;try{if(ME)localStorage.setItem(meKey(),ME);else localStorage.removeItem(meKey());}catch(e){}renderKeep();}
function pinnable(el,id){if(STATIC)return el;el.setAttribute("data-id",String(id));el.setAttribute("tabindex","0");el.classList.add("pin");
 el.addEventListener("click",function(ev){if(ev.target.closest&&ev.target.closest("a"))return;setMe(id);});
 el.addEventListener("keydown",function(ev){if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();ev.stopPropagation();setMe(id);}});return el;}

function table(heads,rows,groups,cls){var tr=h("tr"),gr=null;if(groups){gr=h("tr",{class:"grp"});groups.forEach(function(g){gr.appendChild(h("th",{colspan:g[1],class:g[2]||null},[h("span",{text:g[0]})]));});}heads.forEach(function(x,i){tr.appendChild(typeof x==="string"?th(x,i===0?"team":null):th(x[0],x[1],x[2]));});
 return h("table",{class:"st"+(cls?" "+cls:"")},[h("thead",null,gr?[gr,tr]:[tr]),h("tbody",null,rows)]);}
function td(text,c){return h("td",{class:c||null,text:text});}

function rotoSheet(v,title,sub){var n=v.order.length,cats=DOC.categories,ids=v.order,tp=P.places(ids.map(function(i){return v.teams[i].total;}));
 var rows=ids.map(function(id,r){var t=v.teams[id],tr=h("tr",null,[teamTh(id)]);
  cats.forEach(function(c){var p=t.points[c.cat];tr.appendChild(td(P.fmtPts(p),P.cls(p,n)));});
  tr.appendChild(td(P.fmtPts(t.total),"total "+P.cls(tp[r],n)));tr.appendChild(td(String(t.rank),"rank"));return tr;});
 return sheet("data",title,sub,[scroller(table(["Team"].concat(cats.map(function(c){return c.cat;}),["Total","Rank"]),rows))],"No yellow used: green = stronger, red = weaker, white = neutral.");}
function statsSheet(v,title,sub,withScore){var n=v.order.length,cats=DOC.categories,ids=v.order,sp=withScore?P.places(ids.map(function(i){return v.teams[i].score;})):[];
 var rows=ids.map(function(id,r){var t=v.teams[id],tr=h("tr",null,[teamTh(id)]);
  cats.forEach(function(c){tr.appendChild(td(P.fmtVal(c.pct,t.values[c.cat]),P.cls(t.points[c.cat],n)));});
  if(withScore)tr.appendChild(td(t.score==null?"–":String(t.score),"score "+P.cls(sp[r],n)));return tr;});
 return sheet("data",title,sub,[scroller(table(["Team"].concat(cats.map(function(c){return c.cat;}),withScore?["Score"]:[]),rows))],"FG% and FT% shown to three decimals; turnovers are better when lower.");}
function legend(week){var sw=[["dark-green","Dark green"],["green","Green"],["light-green","Light green"],["white","Tie / neutral"],["light-red","Light red"],["red","Red"],["dark-red","Dark red"]],
 kids=sw.map(function(s){return h("div",{class:"sw"},[h("span",{class:"chip "+s[0]}),s[1]]);});
 if(week)kids.push(h("div",{class:"sw"},[h("span",{class:"chip",style:"box-shadow:inset 0 0 0 3px var(--actual)"}),"Actual Week "+week+" matchup"]));
 return h("div",{class:"legend"},kids);}
function matrixSheet(v,title,sub,week){var ids=v.allPlayOrder,nw=v.weeks.length,opp={};
 (v.matchups||[]).forEach(function(m){opp[m[0]]=m[1];opp[m[1]]=m[0];});
 var hr=h("tr",null,[th("Team","side")]);ids.forEach(function(id){hr.appendChild(h("th",{title:name(id),text:name(id)}));});hr.appendChild(th("All-Play"));hr.appendChild(th("Win%"));
 var rows=ids.map(function(a){var t=v.teams[a],tr=h("tr",null,[pinnable(h("th",{class:String(a)===ME?"me":null,title:name(a)+(STATIC?"":" · tap to highlight your team"),text:name(a)}),a)]);
  ids.forEach(function(b){if(a===b){tr.appendChild(td("—","diag"));return;}var c=v.matrix[a][b],m=(c[0]-c[1])/nw,
   cell=h("td",{class:P.matrixCls(m)+(opp[a]===b?" actual":"")},[c[0]+"-"+c[1]]);if(c[2])cell.appendChild(h("span",{class:"small",text:"T"+c[2]}));tr.appendChild(cell);});
  tr.appendChild(td(t.allPlay.join("-"),"record"));tr.appendChild(td(P.pct3(t.winPct),"pct"));return tr;});
 var t=h("table",{class:"mx"},[h("thead",null,[hr]),h("tbody",null,rows)]);
 return sheet("matrix",title,sub,[legend(week),scroller(t)],"Cell values are category scores from the row team's perspective. Example: 6-3 means the row team wins 6 categories to 3. Ties are shown as T1 when present."+(week?"":" Season cells add up the category records of every week; colours use the average weekly margin."));}

/* ---- season boards ---- */
function sTitle(b){return /^Season/.test(b)?lg()+" "+b+", "+span(DOC.views.season):lg()+" "+b+" "+span(DOC.views.season).replace("Weeks ","Season, Weeks ");}
function orderBy(map,key){return Object.keys(map).sort(function(a,b){return map[a][key]-map[b][key]||a-b;});}
function chips(arr,n){return h("span",{class:"chips"},arr.map(function(r){return h("span",{class:P.rankCls(r,n),text:String(r)});}));}
function boardSheet(b){var C=DOC.composites,n=Object.keys(DOC.teams).length,s=DOC.views.season,sub={
 weekly:"Each week's roto total added up",allplay:"Every week's all-play record added up",real:"Actual matchup record next to what the weekly all-play Win% predicted",
 catluck:"Categories won in real matchups next to what each category's all-play share predicted",
 kings:"Who led each category over the season and in a single week",boom:"Best week, worst week and how steady each team was",power:"The average of a team's ranks on four boards, nothing hidden"}[b];
 var rows,heads,note,title,groups=null;
 if(b==="weekly"){title="Weekly Roto Points";var o=orderBy(C.weeklyRoto,"rank"),ps=P.places(o.map(function(i){return C.weeklyRoto[i].sum;}));
  heads=["Team","Points","Avg / week","Weekly ranks","Rank"];
  rows=o.map(function(id,i){var r=C.weeklyRoto[id];return h("tr",null,[teamTh(id),td(P.fmtPts(r.sum),"total "+P.cls(ps[i],n)),td(r.avg.toFixed(2),""),h("td",{class:"wide"},[chips(r.weekRanks,n)]),td(String(r.rank),"rank")]);});
  note="Formula: sum of each week's roto total over weeks "+C.weeks[0]+"-"+C.weeks[C.weeks.length-1]+" (a week's total = the 1..n category places added up). Weekly ranks: the team's roto rank in each week, W"+C.weeks[0]+" first.";}
 else if(b==="allplay"){title="Season All-Play";var o=orderBy(C.seasonAllPlay,"rank");heads=["Team","W-L-T","Win%","Rank"];
  rows=o.map(function(id){var r=C.seasonAllPlay[id];return h("tr",null,[teamTh(id),td(r.record.join("-")),td(P.pct3(r.winPct),P.rankCls(r.rank,n)),td(String(r.rank),"rank")]);});
  note="Formula: every week's all-play record (each team against every other team, by category wins) added up; Win% = (W + T/2) / (W + L + T).";}
 else if(b==="real"){title="Real Record & Luck";var o=orderBy(C.realRecord,"rank"),lp=P.places(o.map(function(i){return C.realRecord[i].luck;}));
  heads=["Team","Cat W-L-T","Cat Win%","Matchups","Real wins","Expected wins","Luck","Rank"];
  rows=o.map(function(id,i){var r=C.realRecord[id];return h("tr",null,[teamTh(id),td(r.catRecord?r.catRecord.join("-"):"–"),td(P.pct3(r.catWinPct),P.rankCls(r.rank,n)),td(r.record.join("-")),td(String(r.realWins)),td(r.expectedWins.toFixed(2)),td(P.signed(r.luck,2),"total "+P.cls(lp[i],n)),td(String(r.rank),"rank")]);});
  note="Real = actual matchup result from the Score column (a tied matchup counts half a win). Expected wins = the sum of each week's all-play Win%. Luck = real wins minus expected wins: positive = more wins than the stats earned. Rank: category Win% (W + T/2) / (W + L + T) over every category battle against your actual opponents, which is how Yahoo ranks head-to-head category leagues; Yahoo only counts finished weeks, this board includes the week in progress. How to calculate expected wins by hand: for one week, take your category wins, losses and ties against every other team (the All-Play Matrix total, e.g. 16 teams x 9 categories = 135 head-to-head category battles; 90-40-5 gives (90 + 5/2) / 135 = 0.685). Do that for every week and add the weekly Win% values. After 3 weeks of 0.685, 0.500 and 0.400 your expected wins are 1.59; if you actually won 3 matchups, your luck is +1.41.";}
 else if(b==="catluck"){title="Category Luck";var cl=C.catLuck||{},o=orderBy(cl,"rank"),cats=DOC.categories,lp=P.places(o.map(function(i){return cl[i].luck;})),
   cp=cats.map(function(c){return P.places(o.map(function(i){return cl[i].byCat[c.cat].diff;}));});
  heads=["Team",["Real cats","tot"],["Expected cats","tot"],["Luck","tot"]].concat(cats.map(function(c,k){return [c.cat,k?null:"sep"];}),[["Rank","sep"]]);
  rows=o.map(function(id,i){var r=cl[id],tr=h("tr",null,[teamTh(id),td(String(r.real),"tot"),td(r.expected.toFixed(2),"tot"),td(P.signed(r.luck,2),"tot total "+(r.luck>0.005?"pos":r.luck<-0.005?"neg":""))]);
   cats.forEach(function(c,k){tr.appendChild(td(P.signed(r.byCat[c.cat].diff,2),"cat "+(k?"":"sep ")+P.cls(cp[k][i],n)));});tr.appendChild(td(String(r.rank),"rank sep"));return tr;});
  groups=[["",1],["Season totals",3,"tot"],["Luck by category (real − expected)",cats.length,"sep"],["",1,"sep"]];
  note="Real cats = categories won against the actual opponent each week (a level category counts half). Expected cats = in each category, the share of the other teams you would have beaten that week (all-play), added over the weeks. Each category column is real minus expected: positive = you won that category more often than your stats earned, negative = less. Luck = the sum over categories. Example: in a 16-team league a team ranks 12th of 16 in PTS one week, so it beat 4 of 15 teams: expected 0.27; if it also won that category against its opponent (real 1), that is +0.73. Level teams count half.";}
 else if(b==="kings"){title="Category Kings";heads=[["Category","team"],["Leader","left"],["Total",null],["Leader","left sep"],["Week",null],["Best",null]];
  var kc=DOC.categories.filter(function(c){return C.categoryKings[c.cat];}),
   who=function(k){return k?h("td",{class:"left king"},[h("span",{class:"kn",text:name(k.team)}),(k.also&&k.also.length)?h("span",{class:"small",text:"+"+k.also.length+" level"}):null].filter(Boolean)):td("–","left");};
  rows=kc.map(function(c){var k=C.categoryKings[c.cat],a=k.season,w=k.week,tr=h("tr",null,[h("th",{class:"team",text:c.cat+(c.lower?" (fewer is better)":"")}),who(a),td(a?P.fmtVal(c.pct,a.value):"–","kv")]);
   var wt=who(w);wt.className+=" sep";tr.appendChild(wt);tr.appendChild(td(w?"W"+w.week:"–","kw"));tr.appendChild(td(w?P.fmtVal(c.pct,w.value):"–","kv"));return tr;});
  groups=[["",1],["Season",2],["Single week",3]];
  note="Season leader: the best summed category total over the season. Single week: the best one-week total in that category. Level holders show as +N level. Turnovers are left out: a tanking or AFK team racks up few turnovers, so leading TO says nothing about skill.";}
 else if(b==="boom"){title="Boom / Bust";var o=orderBy(C.boomBust,"rank");heads=["Team","Best week","Worst week","Consistency (SD)","Rank"];
  rows=o.map(function(id){var r=C.boomBust[id];return h("tr",null,[teamTh(id),td("W"+r.best.week+" · "+P.fmtPts(r.best.total),"wide"),td("W"+r.worst.week+" · "+P.fmtPts(r.worst.total),"wide"),td(r.stdev.toFixed(2),P.rankCls(r.rank,n)),td(String(r.rank),"rank")]);});
  note="Best / worst week by roto total. Consistency = standard deviation (population) of the weekly roto totals; lower = steadier, and rank 1 is the steadiest.";}
 else{title="Power Rank";var o=orderBy(C.power,"rank");heads=["Team","Season Roto","Weekly Roto","Season All-Play","Real Record","Average","Power"];
  rows=o.map(function(id){var r=C.power[id],tr=h("tr",null,[teamTh(id)]);["seasonRoto","weeklyRoto","seasonAllPlay","realRecord"].forEach(function(k){tr.appendChild(td(r.ranks[k]==null?"–":String(r.ranks[k]),P.rankCls(r.ranks[k],n)));});
   tr.appendChild(td(r.avg==null?"–":r.avg.toFixed(2)));tr.appendChild(td(String(r.rank),"rank"));return tr;});
  note="Formula: the plain average of a team's rank on Season Roto, Weekly Roto Points, Season All-Play and Real Record (ranked by category Win%, as in Yahoo's standings); lowest average = 1. No weights.";}
 return sheet("data",sTitle(title),sub,[scroller(table(heads,rows,groups,b==="catluck"?"luck":null))],note);}

function seasonSheet(){var b=boardOf(),s=DOC.views.season;
 if(b==="roto")return rotoSheet(s,lg()+" Roto Rank "+span(s).replace("Weeks ","Season, Weeks "),"Category-by-category roto points on the season's summed totals • higher is better • ties share the points");
 if(b==="totals")return statsSheet(s,sTitle("Stats"),"Raw season totals • percentages from summed makes and attempts",false);

 return boardSheet(b);}
function weekSheet(){var w=weekNo(),v=DOC.views["w"+w],v_=viewOf();
 if(v_==="stats")return statsSheet(v,lg()+" Stats Week "+w,"Raw weekly totals • score column shows the actual Yahoo matchup score",true);
 if(v_==="allplay")return matrixSheet(v,lg()+" All-Play Matrix Week "+w,"How every team would have fared against every other team this week",w);
 return rotoSheet(v,lg()+" Roto Rank Week "+w,"Category-by-category roto points • higher is better • ties share the points");}

function measure(){var m=$("hmeta")||h("meta",{id:"hmeta",name:"report-height"}),s=document.querySelector(".sheet");if(!s)return;
 m.setAttribute("content",String(Math.ceil(s.getBoundingClientRect().bottom+window.pageYOffset)));document.head.appendChild(m);}
